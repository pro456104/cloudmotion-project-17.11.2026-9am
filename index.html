    <script>
      (function () {
        var makeFetchWritable = function () {
          try {
            var own = Object.getOwnPropertyDescriptor(window, 'fetch');
            var proto =
              typeof Window !== 'undefined' && Window.prototype
                ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
                : undefined;
            var desc = own || proto;
            if (desc && desc.get && !desc.set && (!own || own.configurable)) {
              var origGet = desc.get;
              var hasOverride = false;
              var overrideFn = undefined;
              Object.defineProperty(window, 'fetch', {
                get: function () {
                  return hasOverride ? overrideFn : origGet.call(window);
                },
                set: function (nextFetch) {
                  hasOverride = true;
                  overrideFn = nextFetch;
                },
                configurable: true,
                enumerable: true,
              });
            }
          } catch (_e) {
            // Host environment forbids redefining window.fetch
          }
        };

        makeFetchWritable();

        if (typeof document !== 'undefined') {
          document.addEventListener('DOMContentLoaded', makeFetchWritable, {
            once: true,
          });
        }

        window.addEventListener(
          'error',
          function (event) {
            var filename = (event && event.filename) || '';
            var msg = (event && event.message) || '';
            if (
              filename.indexOf('chrome-extension://') === 0 &&
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
